# Python lint and format rules (docs/style_guide.md). Moves into pyproject.toml
# when the analysis code becomes a package (refactor Phase 5).
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "D", "B", "UP"]
ignore = ["D203", "D213"]        # one docstring style: summary on the first line, no blank line before class doc

[lint.pydocstyle]
convention = "google"
