name: Bug Report
description: Report an issue, build failure, or incorrect behavior in ComputeEdge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you are running on a supported Apple Silicon platform.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, CLI flags, or minimal C++ code snippet to reproduce.
      placeholder: |
        1. cmake --preset release
        2. cmake --build --preset release
        3. ./build/release/benchmarks/...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hardware model, macOS version, Xcode CLT version, compiler.
      placeholder: |
        - Hardware: Apple Silicon Mac (e.g. MacBook Air M4)
        - macOS: 15.x
        - Xcode CLT / Apple Clang: 16.x
        - CMake: 3.x
    validations:
      required: true
